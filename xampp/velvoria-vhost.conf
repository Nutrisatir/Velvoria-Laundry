# Tambahkan blok ini ke C:\\xampp\\apache\\conf\\extra\\httpd-vhosts.conf
# Pastikan folder proyek diekstrak ke C:\\xampp\\htdocs\\VelvoriaLaundry

<VirtualHost *:80>
    ServerName velvoria.test
    DocumentRoot "C:/xampp/htdocs/VelvoriaLaundry/public"

    <Directory "C:/xampp/htdocs/VelvoriaLaundry/public">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    ErrorLog "logs/velvoria-error.log"
    CustomLog "logs/velvoria-access.log" combined
</VirtualHost>
